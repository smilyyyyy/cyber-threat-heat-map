apiVersion: 1
datasources:
  - name: ThreatDB
    uid: threatdb
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro                    # read-only account
    isDefault: true
    editable: false
    jsonData:
      database: threatdb
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
